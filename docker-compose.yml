version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: dermia_postgis
    restart: always
    environment:
      POSTGRES_DB: dermia
      POSTGRES_USER: dermia_user
      POSTGRES_PASSWORD: dermia_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermia_user -d dermia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dermia_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://dermia_user:dermia_secure_password_2026@postgres:5432/dermia
      SECRET_KEY: dermia-production-jwt-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dermia_dashboard
    restart: always
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  pgdata:
